# Requires a GitHub repository and configured OAuth authentication before use.
backend:
  name: github
  repo: cliva1951/maria-nutrition-website
  branch: main
media_folder: "images/uploads"
public_folder: "/images/uploads"
collections:
  - name: "articles"
    label: "Articles"
    folder: "content/articles"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publication date", name: "date", widget: "datetime" }
      - { label: "Category", name: "category", widget: "string" }
      - { label: "Article", name: "body", widget: "markdown" }
